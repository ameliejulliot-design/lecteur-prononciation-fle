
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulaire - Monsieur Madame</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #293d34;
      background: #ffffff;
      margin: 0;
      padding: 24px;
    }

    .lecteur {
      max-width: 560px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .intro {
      color: #68776f;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .phrase {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid #e5ebe7;
    }

    .lecture {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #e5f0e8;
      color: #28634c;
      font-size: 17px;
      cursor: pointer;
    }

    .lecture:hover {
      background: #d2e5d8;
    }

    .texte {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .aide {
      font-size: 13px;
      color: #68776f;
      margin-top: 3px;
    }
  </style>
</head>

<body>
  <main class="lecteur">
    <h1>Vocabulaire - Monsieur Madame</h1>
    <p class="intro">
      Clique sur ▶ pour écouter, puis répète à voix haute.
    </p>

    <div class="phrase">
      <button class="lecture" data-fichier="mr.mp3"
        aria-label="Écouter Monsieur">▶</button>
      <div>
        <div class="texte">Monsieur</div>
        <div class="aide">Pour parler à un homme de manière formelle</div>
      </div>
    </div>

    <div class="phrase">
      <button class="lecture" data-fichier="mme.mp3"
        aria-label="Écouter Madame">▶</button>
      <div>
        <div class="texte">Madame</div>
        <div class="aide">Pour parler à une femme de manière formelle</div>
      </div>
    </div>

  </main>

  <script>
    const audio = document.getElementById("audio");
    const boutons = document.querySelectorAll(".lecture");
    let boutonActif = null;

    function remettreBoutonsAZero() {
      boutons.forEach(bouton => bouton.textContent = "▶");
    }

    boutons.forEach(bouton => {
      bouton.addEventListener("click", async () => {
        const fichier = bouton.dataset.fichier;

        if (boutonActif === bouton && !audio.paused) {
          audio.pause();
          bouton.textContent = "▶";
          return;
        }

        if (boutonActif !== bouton) {
          audio.pause();
          audio.src = "audios/" + fichier;
          audio.load();
        }

        remettreBoutonsAZero();
        boutonActif = bouton;

        try {
          await audio.play();
          bouton.textContent = "Ⅱ";
        } catch (erreur) {
          alert("La lecture a échoué. Vérifie que le fichier audio est bien présent dans le dossier audios.");
          boutonActif = null;
          remettreBoutonsAZero();
        }
      });
    });

    audio.addEventListener("ended", () => {
      remettreBoutonsAZero();
      boutonActif = null;
    });

    audio.addEventListener("pause", () => {
      if (boutonActif) boutonActif.textContent = "▶";
    });
  </script>
</body>
</html>
